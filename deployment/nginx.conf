# ============================================================================
# JoyFlow e-commerce — Nginx site configuration (template)
#
# Install:
#   sudo cp deployment/nginx.conf /etc/nginx/sites-available/joyflow
#   sudo ln -s /etc/nginx/sites-available/joyflow /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # if the default site conflicts
#   sudo nginx -t && sudo systemctl reload nginx
#
# After HTTPS is configured with Certbot, Cerbot keeps this file intact and
# inserts a `listen 443 ssl;` block plus a redirect; the /api/ proxy block
# below is left untouched so webhooks and checkout keep working.
#
# CHANGE THE THREE PLACEHOLDERS:  your-domain.com, the dist root, and the
# PayRam merchant/domain if different.
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    # --- CHANGE ME: your real domain ---------------------------------------
    server_name your-domain.com www.your-domain.com;

    # React production build (output of `npm run build` in the repo root).
    # --- CHANGE ME if your dist folder differs ------------------------------
    root /var/www/joyflow-ecommerce/client/dist;
    index index.html;

    # Security headers (Helmet already does this for /api; add for the SPA).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Large uploads are not expected on a storefront; keep a sane cap so a
    # malicious 2 GB POST cannot saturate the reverse proxy.
    client_max_body_size 1m;

    # Static assets are fingerprinted by Vite -> long-lived cache.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
        try_files $uri =404;
    }

    # SPA fallback: every non-file path serves index.html so React Router
    # (client-side /checkout, /cart, /_authenticated, orders, success pages)
    # works on refresh and on direct URL entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------
    # API reverse proxy -> Node.js/Express on 127.0.0.1:5000
    #
    # Handles /api/checkout, /api/orders, /api/payments, /api/plan-quotes,
    # /api/payment-config, /api/products, /api/health and the PayRam webhook.
    #
    # The Express API is only reachable on 127.0.0.1 (PORT 5000). Do NOT open
    # port 5000 in UFW; Nginx proxies it locally instead.
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host hardware;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Webhooks are delivered as raw application/json; Express needs the
        # un-buffered body to verify the PayRam HMAC signature, so turn
        # buffering OFF for the /api/ block.
        proxy_request_buffering off;
        proxy_buffering off { _ => break; }

        # Never cache API responses.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store";
    }

    # One more safety net: PHP is not installed on this store. If some
    # leftover .php path is requested, 404 it explicitly.
    location ~ \.php$ { return 404; }
}
